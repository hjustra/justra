<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Justra PJe</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        width: 310px;
        margin: 0;
        background: #ffffff;
        color: #182230;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      h1 {
        margin: 0;
        color: #101828;
        font-size: 16px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #52606d;
        font-size: 12px;
        line-height: 1.4;
      }

      .status {
        border: 1px solid rgba(16, 24, 40, 0.12);
        border-radius: 8px;
        background: #f8fafc;
        color: #344054;
        padding: 10px;
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      button {
        min-height: 38px;
        border: 1px solid rgba(16, 24, 40, 0.16);
        border-radius: 8px;
        background: #ffffff;
        color: #182230;
        cursor: pointer;
        font-size: 12px;
        font-weight: 750;
      }

      button.primary {
        border-color: #113c38;
        background: #113c38;
        color: #ffffff;
      }

      button:hover {
        background: #f8fafc;
      }

      button.primary:hover {
        background: #0b2c29;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Justra PJe</h1>
        <p>Baixe ou envie os documentos do processo aberto no PJe.</p>
      </div>
      <div class="status" id="status">Resolva o CAPTCHA no PJe antes de iniciar.</div>
      <div class="actions">
        <button class="primary" id="downloadAllDocuments" type="button">Baixar todos docs</button>
        <button id="sendAllDocuments" type="button">Enviar para Justra</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
