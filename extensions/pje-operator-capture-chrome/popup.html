<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Justra PJe Operador</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        width: 340px;
        margin: 0;
        background: #ffffff;
        color: #182230;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      h1 {
        margin: 0;
        color: #101828;
        font-size: 16px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #52606d;
        font-size: 12px;
        line-height: 1.4;
      }

      label {
        display: grid;
        gap: 5px;
        color: #344054;
        font-size: 12px;
        font-weight: 720;
      }

      input,
      select {
        min-height: 36px;
        border: 1px solid rgba(16, 24, 40, 0.16);
        border-radius: 8px;
        background: #ffffff;
        color: #182230;
        font: inherit;
        font-size: 12px;
        padding: 0 10px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid rgba(16, 24, 40, 0.12);
        border-radius: 8px;
        padding: 10px;
      }

      .switch input {
        width: 18px;
        min-height: 18px;
      }

      .status {
        border: 1px solid rgba(16, 24, 40, 0.12);
        border-radius: 8px;
        background: #f8fafc;
        color: #344054;
        padding: 10px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button {
        min-height: 38px;
        border: 1px solid rgba(16, 24, 40, 0.16);
        border-radius: 8px;
        background: #ffffff;
        color: #182230;
        cursor: pointer;
        font-size: 12px;
        font-weight: 750;
      }

      button.primary {
        border-color: #113c38;
        background: #113c38;
        color: #ffffff;
      }

      button:hover {
        background: #f8fafc;
      }

      button.primary:hover {
        background: #0b2c29;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Justra PJe Operador</h1>
        <p>Resolva o CAPTCHA manualmente; quando o processo carregar, a extensão envia automaticamente.</p>
      </div>

      <div class="status" id="status">Carregando configuração...</div>

      <div class="switch">
        <div>
          <strong>Autoenviar PJe liberado</strong>
          <p>Ativo somente em páginas do PJe TRT2.</p>
        </div>
        <input id="enabled" type="checkbox">
      </div>

      <label>
        Ambiente
        <select id="environmentName"></select>
      </label>

      <label>
        CNJ esperado opcional
        <input id="expectedProcessNumber" type="text" inputmode="numeric" placeholder="1001051-45.2025.5.02.0075">
      </label>

      <label>
        Job ID opcional
        <input id="jobId" type="text" placeholder="pje:10010514520255020075">
      </label>

      <div class="actions">
        <button class="primary" id="save" type="button">Salvar</button>
        <button id="captureNow" type="button">Capturar agora</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
